apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spring-enterprise-guides-app-advisor-intro
spec:
  title: Spring Academy - Enterprise Guides - App Advisor Intro
  description: "A workshop that demonstrates how Spring Application Advisor can help you to  continuously and incrementally upgrade Spring application dependencies, source code and configuration"
  difficulty: beginner
  duration: 30m
  vendor: Broadcom
  workshop:
    image: jdk17-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(assets_repository)/$(workshop_name).tar.gz"
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    namespaces:
      security:
        token:
          # This wasn't being done before but should be so that workshop user
          # cannot access the Educates cluster session namespace, which they don't need.
          # See note below though about volume mount for token.
          enabled: false
    env:
    - name: LAB_VERSION
      value: "${VERSION}"
    - name: LAB_NUMBER
      value: "1"
    - name: WEBSERVER
      value: "$(ingress_protocol)://$(assets_repository)"
    - name: BOOTSTRAP_COMMAND
      value: ":"
    # In-cluster services (see lab-services below). Session pods can't reach the internet.
    - name: LAB_FILES_URL
      value: "http://lab-services:8080/files"
    - name: MAVEN_MIRROR_URL
      value: "http://lab-services:8080/maven2"
    resources:
      memory: 4Gi
    ingresses:
    - name: petclinic
      port: 8080
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      git:
        enabled: true
    volumeMounts:
    - name: binaries
      mountPath: /home/eduk8s/bin/advisor
      subPath: advisor
    initContainers:
    # Fetches the advisor tarball from lab-services, which holds it behind a token that is only
    # mounted into this init container (never into the workshop container).
    - name: download-app-advisor-cli
      image: ghcr.io/vmware-tanzu-labs/educates-base-environment:2.5.2
      imagePullPolicy: $(workshop_image_pull_policy)
      command: ["/bin/bash"]
      args:
        - "-c"
        - |
          set -eo pipefail
          cd /opt/tanzu/bin
          until curl -sf -H "X-Lab-Token: ${LAB_VAULT_TOKEN}" -o ${DESTINATION_FILE_NAME}.tar http://lab-services:8080/advisor/advisor.tar; do
            echo "Waiting for lab-services to publish the advisor CLI"
            sleep 5
          done
          tar -xvf ${DESTINATION_FILE_NAME}.tar
          mv cli-binary/advisor ${DESTINATION_FILE_NAME}
          chmod 111 ${DESTINATION_FILE_NAME}
          rm -rf ${DESTINATION_FILE_NAME}.tar cli-binary
      env:
        - name: DESTINATION_FILE_NAME
          value: "advisor"
        - name: LAB_VAULT_TOKEN
          valueFrom:
            secretKeyRef:
              name: advisor-vault
              key: token
      volumeMounts:
        - name: binaries
          mountPath: /opt/tanzu/bin/
    volumes:
    - name: binaries
      emptyDir: {}
    - name: workshop-init-container-scripts
      secret:
        secretName: workshop-init-container-scripts
        defaultMode: 0755
    patches:
      initContainers:
      - name: pre-session-setup
        # Educates needs a $(base_environment_image) variable can use.
        # For now hard wire to educates-base-environment image. Aim to
        # change for Educates 2.6.0.
        image: ghcr.io/vmware-tanzu-labs/educates-base-environment:2.5.2
        # Execute setup script mounted from secret.
        command: ["/opt/init-setup-scripts/setup.sh"]
        volumeMounts:
        - name: workshop-init-container-scripts
          mountPath: /opt/init-setup-scripts
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
          newRootPath: usr/share/nginx/html
    objects:
    - apiVersion: secrets.educates.dev/v1beta1
      kind: SecretCopier
      metadata:
        name: $(workshop_namespace)-spring-enterprise-guides-gcp
      spec:
        rules:
        - sourceSecret: 
            name: gcp
            namespace: spring-academy
          targetSecret:
            name: gcp
          targetNamespaces:
            nameSelector:
              matchNames:
              - spring-enterprise-guides-*
    - apiVersion: secrets.educates.dev/v1beta1
      kind: SecretCopier
      metadata:
        name: $(workshop_namespace)-spring-enterprise-guides-advisor-vault
      spec:
        rules:
        - sourceSecret:
            name: advisor-vault
            namespace: spring-academy
          targetSecret:
            name: advisor-vault
          targetNamespaces:
            nameSelector:
              matchNames:
              - spring-enterprise-guides-*
    - apiVersion: v1
      kind: Secret
      metadata:
        name: workshop-init-container-scripts
      stringData:
        setup.sh: |
          #!/bin/bash
          set -x
          set -eo pipefail
          echo "Put commands here that need to be done in init container prior to workshop session"
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: network-policy-creator
      rules:
      - apiGroups:
        - networking.k8s.io
        resources:
        - networkpolicies
        verbs:
        - create
        - get
        - update
        - delete
        - patch
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: network-policy-manager
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: network-policy-creator-binding
      subjects:
      - kind: ServiceAccount
        name: network-policy-manager
      roleRef:
        kind: Role
        name: network-policy-creator
        apiGroup: rbac.authorization.k8s.io
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: replace-default-network-policy
      spec:
        ttlSecondsAfterFinished: 1000
        template:
          spec:
            serviceAccountName: network-policy-manager
            restartPolicy: Never
            containers:
            - name: deny-all-policy-updater
              image: ghcr.io/vmware-tanzu-labs/educates-base-environment:latest
              command:
              - /bin/bash
              - -c
              args:
              - |
                kubectl -s https://kubernetes.default:443 --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token) \
                  -n $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace) \
                  patch networkpolicy educates-network-policy --type=strategic \
                  --patch '{"spec": {"egress": [], "policyTypes": ["Egress"]}}'
              volumeMounts:
              - name: sa-token-volume
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
            volumes:
            - name: sa-token-volume
              projected:
                sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: educates-network-policy-egress-allow-private
      spec:
        podSelector:
          matchLabels:
            training.educates.dev/component: session
            training.educates.dev/workshop.name: spring-enterprise-guides-app-advisor-intro
        policyTypes:
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 10.0.0.0/8
          - ipBlock:
              cidr: 172.16.0.0/12
          - ipBlock:
              cidr: 192.168.0.0/16
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: educates-network-policy-egress-allow-all
      spec:
        podSelector:
          matchExpressions:
            - key: deployment
              operator: In
              values:
              - assets-server
              - lab-services
        policyTypes:
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 0.0.0.0/0
    - apiVersion: v1
      kind: ConfigMap
      metadata:
        name: lab-services-nginx
      data:
        default.conf.template: |
          proxy_cache_path /tmp/maven-cache levels=1:2 keys_zone=maven:10m max_size=5g inactive=30d use_temp_path=off;
          server {
            listen 8080;

            # Read-only caching proxy of Maven Central for session pods
            location /maven2/ {
              limit_except GET HEAD { deny all; }
              proxy_pass https://repo.maven.apache.org/maven2/;
              proxy_ssl_server_name on;
              proxy_cache maven;
              proxy_cache_valid 200 301 302 12h;
              proxy_cache_valid 404 1m;
              proxy_cache_use_stale error timeout updating;
            }

            # Non-sensitive files (SDKMAN/JDK bundle)
            location /files/ {
              alias /srv/files/;
            }

            # Commercial software: only served to callers presenting the vault token
            location /advisor/ {
              if ($http_x_lab_token != "${LAB_VAULT_TOKEN}") {
                return 403;
              }
              alias /srv/private/;
            }
          }
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: lab-services
      spec:
        replicas: 1
        selector:
          matchLabels:
            deployment: lab-services
        template:
          metadata:
            labels:
              deployment: lab-services
          spec:
            securityContext:
              fsGroup: 1001
            initContainers:
            # Open-egress downloads happen here, once per workshop environment
            - name: download-app-advisor-cli
              image: google/cloud-sdk:latest
              command: ["/bin/bash"]
              args:
                - "-c"
                - |
                  set -eo pipefail
                  gcloud auth activate-service-account --key-file=/creds/bucket-reader
                  gcloud storage cp "gs://${GCP_BUCKET_NAME}/${SOURCE_FILE_NAME}" /srv/private/advisor.tar
                  chmod 644 /srv/private/advisor.tar
              env:
                - name: GCP_BUCKET_NAME
                  value: "academy-artifacts"
                - name: SOURCE_FILE_NAME
                  value: "spring/binaries/application-advisor-cli-linux/application-advisor-cli-linux-1.6.7.tar" # Change also the version in the workshop content
              volumeMounts:
                - name: private
                  mountPath: /srv/private
                - name: gcp-key
                  readOnly: true
                  mountPath: /creds
            - name: build-sdkman-bundle
              image: ghcr.io/vmware-tanzu-labs/educates-base-environment:2.5.2
              command: ["/bin/bash"]
              args:
                - "-c"
                - |
                  set -eo pipefail
                  export HOME=/tmp/sdkman-home SDKMAN_DIR=/tmp/sdkman-home/.sdkman
                  mkdir -p $HOME
                  curl -s "https://get.sdkman.io?rcupdate=false" | bash
                  source $SDKMAN_DIR/bin/sdkman-init.sh
                  export sdkman_auto_answer=true
                  # Same order as the original setup script, which leaves 11 as the default
                  sdk install java 17.0.18-librca
                  sdk install java 11.0.30-librca
                  rm -rf $SDKMAN_DIR/archives/* $SDKMAN_DIR/tmp/*
                  tar -czf /srv/files/sdkman.tar.gz -C $HOME .sdkman
              volumeMounts:
                - name: files
                  mountPath: /srv/files
            containers:
            - name: nginx
              image: nginxinc/nginx-unprivileged:1.27-alpine
              ports:
              - containerPort: 8080
              env:
                - name: LAB_VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: advisor-vault
                      key: token
              volumeMounts:
                - name: nginx-template
                  mountPath: /etc/nginx/templates
                - name: files
                  mountPath: /srv/files
                  readOnly: true
                - name: private
                  mountPath: /srv/private
                  readOnly: true
                - name: cache
                  mountPath: /tmp
            volumes:
            - name: nginx-template
              configMap:
                name: lab-services-nginx
            - name: files
              emptyDir: {}
            - name: private
              emptyDir: {}
            - name: cache
              emptyDir: {}
            - name: gcp-key
              secret:
                secretName: gcp
    - apiVersion: v1
      kind: Service
      metadata:
        name: lab-services
      spec:
        selector:
          deployment: lab-services
        ports:
        - port: 8080
          targetPort: 8080
