apiVersion: training.educates.dev/v1beta1
kind: Workshop
metadata:
  name: spring-enterprise-guides-app-advisor-intro
spec:
  title: Spring Academy - Enterprise Guides - App Advisor Intro
  description: "A workshop that demonstrates how Spring Application Advisor can help you to  continuously and incrementally upgrade Spring application dependencies, source code and configuration"
  difficulty: beginner
  duration: 30m
  vendor: Broadcom
  workshop:
    image: jdk17-environment:*
    files:
      - http:
          url: "$(ingress_protocol)://$(assets_repository)/$(workshop_name).tar.gz"
  request:
    parameters:
    - name: USER_DOMAIN
      value: "unknown.domain"
    - name: USER_EMAIL
      value: "somebody@unknown.domain"
  session:
    namespaces:
      security:
        token:
          # This wasn't being done before but should be so that workshop user
          # cannot access the Educates cluster session namespace, which they don't need.
          # See note below though about volume mount for token.
          enabled: false
    env:
    - name: LAB_VERSION
      value: "${VERSION}"
    - name: LAB_NUMBER
      value: "1"
    - name: WEBSERVER
      value: "$(ingress_protocol)://$(assets_repository)"
    - name: BOOTSTRAP_COMMAND
      value: ":"
    resources:
      memory: 4Gi
    ingresses:
    - name: petclinic
      port: 8080
    applications:
      terminal:
        enabled: true
        layout: split
      editor:
        enabled: true
      git:
        enabled: true
    volumeMounts:
    - name: binaries
      mountPath: /home/eduk8s/bin/advisor
      subPath: advisor
    initContainers:
    - name: download-app-advisor-cli
      image: google/cloud-sdk:latest
      imagePullPolicy: $(workshop_image_pull_policy)
      command: ["/bin/bash"]
      args:
        - "-c"
        - |
          cd /opt/tanzu/bin
          gcloud auth activate-service-account --key-file=/creds/bucket-reader
          gcloud storage cp "gs://${GCP_BUCKET_NAME}/${SOURCE_FILE_NAME}" "${DESTINATION_FILE_NAME}.tar"
          tar -xvf ${DESTINATION_FILE_NAME}.tar
          mv cli-binary/advisor ${DESTINATION_FILE_NAME}
          chmod 111 ${DESTINATION_FILE_NAME}
          rm -rf ${DESTINATION_FILE_NAME}.tar cli-binary 
      env:
        - name: GCP_BUCKET_NAME
          value: "academy-artifacts"
        - name: SOURCE_FILE_NAME
          value: "spring/binaries/application-advisor-cli-linux/application-advisor-cli-linux-1.6.7.tar" # Change also the version in the workshop content
        - name: DESTINATION_FILE_NAME
          value: "advisor"
      volumeMounts:
        - name: binaries
          mountPath: /opt/tanzu/bin/
        - name: gcp-key
          readOnly: true
          mountPath: /creds
    volumes:
    - name: binaries
      emptyDir: {}
    - name: gcp-key
      secret:
        secretName: gcp
    - name: workshop-init-container-scripts
      secret:
        secretName: workshop-init-container-scripts
        defaultMode: 0755
    patches:
      initContainers:
      - name: pre-session-setup
        # Educates needs a $(base_environment_image) variable can use.
        # For now hard wire to educates-base-environment image. Aim to
        # change for Educates 2.6.0.
        image: ghcr.io/vmware-tanzu-labs/educates-base-environment:2.5.2
        # Execute setup script mounted from secret.
        command: ["/opt/init-setup-scripts/setup.sh"]
        volumeMounts:
        - name: workshop-init-container-scripts
          mountPath: /opt/init-setup-scripts
  environment:
    assets:
      memory: 0Mi
      ingress:
        enabled: true
      files:
        - image:
            url: ${CONTAINER_REGISTRY}${CONTAINER_REPOSITORY}:${VERSION}
          newRootPath: usr/share/nginx/html
    objects:
    - apiVersion: secrets.educates.dev/v1beta1
      kind: SecretCopier
      metadata:
        name: $(workshop_namespace)-spring-enterprise-guides-gcp
      spec:
        rules:
        - sourceSecret: 
            name: gcp
            namespace: spring-academy
          targetSecret:
            name: gcp
          targetNamespaces:
            nameSelector:
              matchNames:
              - spring-enterprise-guides-*
    - apiVersion: v1
      kind: Secret
      metadata:
        name: workshop-init-container-scripts
      stringData:
        setup.sh: |
          #!/bin/bash
          set -x
          set -eo pipefail
          echo "Put commands here that need to be done in init container prior to workshop session"
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: network-policy-creator
      rules:
      - apiGroups:
        - networking.k8s.io
        resources:
        - networkpolicies
        verbs:
        - create
        - get
        - update
        - delete
        - patch
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: network-policy-manager
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: network-policy-creator-binding
      subjects:
      - kind: ServiceAccount
        name: network-policy-manager
      roleRef:
        kind: Role
        name: network-policy-creator
        apiGroup: rbac.authorization.k8s.io
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: replace-default-network-policy
      spec:
        ttlSecondsAfterFinished: 1000
        template:
          spec:
            serviceAccountName: network-policy-manager
            restartPolicy: Never
            containers:
            - name: deny-all-policy-updater
              image: ghcr.io/vmware-tanzu-labs/educates-base-environment:latest
              command:
              - /bin/bash
              - -c
              args:
              - |
                kubectl -s https://kubernetes.default:443 --certificate-authority=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt \
                  --token=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token) \
                  -n $(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace) \
                  patch networkpolicy educates-network-policy --type=strategic \
                  --patch '{"spec": {"egress": [], "policyTypes": ["Egress"]}}'
              volumeMounts:
              - name: sa-token-volume
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true
            volumes:
            - name: sa-token-volume
              projected:
                sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3600
                - configMap:
                    name: kube-root-ca.crt
                    items:
                    - key: ca.crt
                      path: ca.crt
                - downwardAPI:
                    items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: educates-network-policy-egress-allow-private
      spec:
        podSelector:
          matchLabels:
            training.educates.dev/component: session
            training.educates.dev/workshop.name: spring-enterprise-guides-app-advisor-intro
        policyTypes:
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 10.0.0.0/8
          - ipBlock:
              cidr: 172.16.0.0/12
          - ipBlock:
              cidr: 192.168.0.0/16
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: educates-network-policy-egress-allow-all
      spec:
        podSelector:
          matchExpressions:
            - key: deployment
              operator: In
              values:
              - assets-server
        policyTypes:
        - Egress
        egress:
        - to:
          - ipBlock:
              cidr: 0.0.0.0/0
